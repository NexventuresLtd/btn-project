# NFR-M1: every push and pull request is vetted, tested (race detector, real PostgreSQL), built and exercised in a
# real browser. `go test ./...` runs packages in parallel: each test process clones a template database migrated once
# (internal/testutil), so the shared lock table (max_locks_per_transaction) is no longer exhausted.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: btn
          POSTGRES_PASSWORD: btn
          POSTGRES_DB: btn_ops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U btn -d btn_ops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://btn:btn@localhost:5432/btn_ops?sslmode=disable
      TEST_DATABASE_URL: postgresql://btn:btn@localhost:5432/btn_ops_test?sslmode=disable
      OTP_PEPPER: ci-only-pepper-not-a-secret-0123456789abcdef
      APP_ENV: test
      JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./migrations)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go mod verify
        run: go mod verify
      - name: Migrate (dev + test databases)
        run: |
          go run ./cmd/migrate up
          MIGRATE_TARGET=test go run ./cmd/migrate up
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 -timeout 20m ./...
      - name: Build binaries
        run: CGO_ENABLED=0 go build -trimpath -tags timetzdata -o bin/ ./cmd/server ./cmd/migrate ./cmd/seed ./cmd/import

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Browser e2e (NFR-M1, NFR-P3, §9.1, §12.2): offline acceptance T-01…T-10, offline attendance, WCAG 2.1 AA (axe)
  # and keyboard-only entry, in headless Chrome against the real API + a production build served by `vite preview`.
  # frontend/e2e/run-ci.sh migrates and fills the scratch database, starts both servers and runs the suites.
  e2e:
    name: Browser e2e (Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: btn
          POSTGRES_PASSWORD: btn
          POSTGRES_DB: btn_ops_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U btn -d btn_ops_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://btn:btn@localhost:5432/btn_ops_e2e?sslmode=disable
      CHROME: /usr/bin/google-chrome
      OUT_DIR: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Tools (psql client, Chrome)
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          "$CHROME" --version
      - name: Install web dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run e2e suites
        run: bash frontend/e2e/run-ci.sh
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-out/*.log
            e2e-out/*.json
            e2e-out/shots
          retention-days: 7

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: no env files or secrets in the repository
        run: |
          bad="$(git ls-files | grep -E '(^|/)(\.env(\..*)?|[^/]*\.env(\..*)?|[^/]*\.(pass|pem|key))$' | grep -vE '\.example$' || true)"
          if [ -n "$bad" ]; then echo "::error::env/secret files are tracked:"; echo "$bad"; exit 1; fi
      - name: bash -n + shellcheck
        run: |
          for f in deploy/*.sh frontend/e2e/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/*.sh frontend/e2e/*.sh
