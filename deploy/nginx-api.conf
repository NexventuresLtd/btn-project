# @API_DOMAIN@ — BTN Operations Go API, direct access for integrations (https://@API_DOMAIN@/api/v1/...),
# the OpenAPI document (/api/v1/openapi.json) and the API reference (/api/v1/docs).
# Rendered by deploy/deploy.sh: @LISTEN@ becomes the HTTP or HTTPS listen block, @REDIRECT@ the HTTP → HTTPS server.
# Security headers (CSP, nosniff, CORP…) come from the API itself; CORS allows https://@WEB_DOMAIN@ (FRONTEND_ORIGIN).
server {
@LISTEN@
    server_name @API_DOMAIN@;
    client_max_body_size 11m;  # expense receipts up to 10 MB

    gzip on;
    gzip_types text/plain text/csv application/json application/xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /.well-known/acme-challenge/ { root @ACME_ROOT@; default_type text/plain; }

    location = / { return 302 /api/v1/docs; }

    # same coarse flood guard on /api/auth as the web site (fine-grained limits are in the app)
    location ~ ^/api/(v1/)?auth/ {
        limit_req zone=btn_auth burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://btn_ops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        proxy_pass http://btn_ops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;  # PDF reports, exports
        proxy_send_timeout 120s;
        proxy_buffering off;      # streamed CSV/ZIP exports
    }

    location / { return 404; }
}
@REDIRECT@
