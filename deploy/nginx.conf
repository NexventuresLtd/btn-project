# Host reverse proxy for a bare-metal/VM install (frontend built to /var/www/btn-ops, API on 127.0.0.1:4000).
# Certificates: certbot --nginx -d ops.btnlimited.com
server {
  listen 80;
  server_name ops.btnlimited.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name ops.btnlimited.com;

  ssl_certificate     /etc/letsencrypt/live/ops.btnlimited.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ops.btnlimited.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  root /var/www/btn-ops;
  client_max_body_size 2m;

  # Throttle the sign-in endpoints at the edge as well as in the app.
  location /api/auth/ {
    limit_req zone=btn_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

# Put in the http {} block (e.g. /etc/nginx/conf.d/btn-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=btn_auth:10m rate=10r/m;
