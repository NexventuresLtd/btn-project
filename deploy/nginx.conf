# Static host reverse proxy for a manual install or the Docker setup (frontend built to /var/www/btn-ops, API on
# 127.0.0.1:4000). deploy/deploy.sh does NOT use this file: it renders deploy/nginx-web.conf + deploy/nginx-api.conf.
#   Web: operations.btnlimited.com     (SPA + same-origin /api proxy — the session cookies are scoped to /api/auth)
#   API: operation-api.btnlimited.com  (direct API access for integrations and /api/v1/docs)
# Certificates: certbot certonly --nginx -d operations.btnlimited.com
#               certbot certonly --nginx -d operation-api.btnlimited.com
server {
  listen 80;
  server_name operations.btnlimited.com operation-api.btnlimited.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name operations.btnlimited.com;

  ssl_certificate     /etc/letsencrypt/live/operations.btnlimited.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/operations.btnlimited.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  root /var/www/btn-ops;
  client_max_body_size 11m;  # expense receipts up to 10 MB (P5); JSON stays capped at 1 MB by the API

  # Throttle the sign-in endpoints at the edge as well as in the app.
  location /api/auth/ {
    limit_req zone=btn_auth burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  location /api/v1/auth/ {  # same routes under the versioned prefix (F2: /api/v1 is an alias of /api)
    limit_req zone=btn_auth burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  # API reference (Redoc from jsDelivr): its own CSP; add_header here replaces the server-level headers, so repeat them.
  location = /api/v1/docs {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; worker-src blob:; connect-src 'self'; frame-ancestors 'none'" always;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

server {
  listen 443 ssl http2;
  server_name operation-api.btnlimited.com;

  ssl_certificate     /etc/letsencrypt/live/operation-api.btnlimited.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/operation-api.btnlimited.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 11m;

  location = / { return 302 /api/v1/docs; }

  location ~ ^/api/(v1/)?auth/ {
    limit_req zone=btn_auth burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/btn-proxy.conf;
  }

  location / { return 404; }
}

# Put in the http {} block (e.g. /etc/nginx/conf.d/btn-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=btn_auth:10m rate=300r/m;
# /etc/nginx/snippets/btn-proxy.conf:
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 120s;
