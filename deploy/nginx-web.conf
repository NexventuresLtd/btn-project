# @WEB_DOMAIN@ — BTN Operations web app (frontend/dist) + same-origin proxy to the Go API.
# Rendered by deploy/deploy.sh: @LISTEN@ becomes the HTTP or HTTPS listen block, @REDIRECT@ the HTTP → HTTPS server.
# The upstream btn_ops_api and the btn_auth rate-limit zone live in /etc/nginx/conf.d/btn-ops.conf (also written by deploy.sh).
# The web app calls /api/... on its own origin: the session cookies are host-only and scoped to /api/auth, so /api
# must stay proxied here (the API domain is for integrations and the API reference).
server {
@LISTEN@
    server_name @WEB_DOMAIN@;
    root @APP_DIR@/frontend/dist;
    index index.html;
    client_max_body_size 11m;  # expense receipts up to 10 MB (P5); JSON stays capped at 1 MB by the API

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ^~ /.well-known/acme-challenge/ { root @ACME_ROOT@; default_type text/plain; }

    # Throttle the sign-in endpoints at the edge as well as in the app (429, not 503: the app reads 503 as "server down").
    location /api/auth/ {
        limit_req zone=btn_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://btn_ops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/v1/auth/ {  # same routes under the versioned prefix (/api/v1 is an alias of /api)
        limit_req zone=btn_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://btn_ops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API reference (Redoc from jsDelivr): its own CSP; add_header here replaces the server-level headers, so repeat them.
    location = /api/v1/docs {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; worker-src blob:; connect-src 'self'; frame-ancestors 'none'" always;
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://btn_ops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        proxy_pass http://btn_ops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;  # PDF reports
        proxy_send_timeout 120s;
    }

    # hashed build assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes; index.html, sw.js and the manifest are always revalidated so updates reach installed PWAs
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
@REDIRECT@
